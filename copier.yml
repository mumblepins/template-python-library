_min_copier_version: "9.0.0"
_subdirectory: ""
_templates_suffix: .jinja

_exclude:
  - "copier.yml"
  - "AGENTS.md"
  - "CHANGELOG.md"
  - ".git"
  - ".github/workflows/template-release.yml"
  - ".idea"
  - "junit.xml"
  - "__pycache__"
  - ".venv"
  - "*.pyc"
  - "uv.lock"
  - ".DS_Store"
  - ".coverage"
  - "coverage.xml"

project_name:
  type: str
  help: "Human-readable project name (e.g., 'My Python Library')"
  default: "My Python Library"

project_slug:
  type: str
  help: "Kebab-case project identifier (used in URLs, package name)"
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

package_name:
  type: str
  help: "Python package name (snake_case)"
  default: "{{ project_slug | replace('-', '_') }}"

description:
  type: str
  help: "Short project description"
  default: ""

author_name:
  type: str
  help: "Author name"
  default: ""

author_email:
  type: str
  help: "Author email"
  default: ""

github_org:
  type: str
  help: "GitHub organization or username"
  default: "mumblepins"

license:
  type: str
  help: "License type"
  choices:
    MIT: "MIT"
    Apache-2.0: "Apache-2.0"
    BSD-3-Clause: "BSD-3-Clause"
    GPL-3.0: "GPL-3.0"
    AGPL-3.0: "AGPL-3.0"
    None: "None"
  default: "MIT"

python_version:
  type: str
  help: "Minimum Python version"
  choices:
    "3.11": "3.11"
    "3.12": "3.12"
    "3.13": "3.13"
    "3.14": "3.14"
  default: "3.14"

_tasks:
  - ["git", "init"]
  - command: '[ "{{ license }}" = "None" ] && rm -f LICENSE || true'
  - ["uv", "sync", "--all-groups"]
  - ["prek", "install"]
  - ["prek", "run", "--all-files"]
