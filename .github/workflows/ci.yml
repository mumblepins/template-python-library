name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install tools
        run: uv tool install prek

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pre-commit
        run: prek run --all-files --show-diff-on-failure

      - name: Run tests
        run: uv run pytest --verbose --cov --cov-report=html --cov-report=term --cov-report=xml --junitxml=junit.xml

      - name: Run mypy
        run: uv run mypy src tests

      - name: Run pyright
        run: pyright
